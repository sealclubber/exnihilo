# District kinds, their size, and how they are named.
#
# A settlement gets one district per `residentsPerDistrict` residents, at
# least one. The first kind listed below is the one a single-district
# settlement gets; further districts are shared out by `weight`. A kind with
# `when` instead of `weight` adds exactly one district to settlements that
# meet the condition, and takes only buildings that ask for it.
#
#   placement where the town's layout puts the kind: centre, middle, edge, or
#             waterside (by the sea or the river, where the town has either)
#   statuses  the status tiers whose dwellings the kind takes, for a tier
#             that has no list of its own under `tierDistricts`
#   whenDraw  instead of `weight` or `when`: the kind adds exactly one district
#             to settlements whose draw (travellers.yaml) reaches this number
#   types     optional: building types that belong to the kind. Where the
#             settlement has a district of it they stand there, whatever their
#             own entry prefers; where it has none they go where their own
#             entry says, which for the types below is the centre.
#   names     patterns; {settlement} is the settlement's name and any other
#             {key} is filled from `words`

residentsPerDistrict: 1500

# Where each status tier prefers to live: kinds of district in order. A
# dwelling goes to the first entry that the settlement has, and among the
# districts of that entry to the least full. An entry in [brackets] is several
# kinds ranked alike. A tier never lives in a kind that is not on its list,
# unless the settlement has none that is.
#
# The wealthy and the noble prefer an upper quarter, then the centre, and are
# never put in a lower quarter or the outskirts. The poor prefer the lower and
# common quarters, ranked alike so that half the town is not crowded into one
# lower quarter, with the harbour and the shanty town where there is one, then
# the outskirts. All of it is a placeholder.
tierDistricts:
  noble: [upper, centre]
  wealthy: [upper, centre]
  comfortable: [[centre, upper], [craft, common], harbour]
  modest: [[common, craft, centre, harbour], outskirts, [lower, upper]]
  poor: [[lower, common, shanty, harbour], outskirts, [craft, centre]]

# Housing near work: the share of dwellings that stand in the district where
# the head of the household works, instead of where the tier prefers. `kinds`
# gives a kind of district a share of its own; 0 closes it, so that nobody is
# moved there for this reason. A household is never moved to a kind its tier
# does not list above. Which dwellings are chosen is drawn from the seed. A
# dwelling with several households follows the head of the first. Placeholders.
housingNearWork:
  share: 0.35
  kinds:
    outskirts: 0.2
    upper: 0

words:
  direction: [North, South, East, West, Upper, Lower]
  age: [Old, New]
  feature: [Hill, Bridge, Gate, Well, Cross, Green, Bank, Ford, Mill, Elm]

kinds:
  - id: centre
    placement: centre
    name: Centre
    weight: 2
    statuses: [modest, comfortable]
    names: ["Old Town", "{settlement} Cross", "High Street", "{age} Market", "{direction} Market", "{feature} Market"]

  # The visitors' quarter: only in a settlement with draw enough, beside the
  # centre. Nobody is housed here but the households that live in its inns.
  # PLACEHOLDERS, for review: the threshold, the names, and the types, which
  # are a small neutral set (inns, the players' hall as a playhouse, a gaming
  # house). To add a type of your own, list it here.
  - id: visitors
    placement: middle
    name: Visitors' quarter
    whenDraw: 22
    statuses: []
    types: [inn, players-hall, gaming-house]
    names: ["Visitors' Quarter", "Travellers' Rest", "{settlement} Inns"]

  - id: craft
    placement: middle
    name: Craft quarter
    weight: 3
    statuses: [modest]
    names: ["Smiths' Row", "Weavers' Lane", "Craftsmen's Quarter", "{direction} Workshops", "{feature} Lane", "{feature} Row"]

  - id: common
    placement: middle
    name: Common quarter
    weight: 4
    statuses: [poor, modest]
    names: ["{direction} Side", "{feature} Ward", "{direction} Ward", "{age} Houses", "{feature} Street"]

  - id: upper
    placement: middle
    name: Upper quarter
    weight: 1
    statuses: [comfortable, wealthy, noble]
    names: ["The Mount", "High Ward", "{direction} Gardens", "{feature} Court", "{feature} Heights"]

  - id: lower
    placement: edge
    name: Lower quarter
    weight: 3
    statuses: [poor]
    names: ["The Warrens", "Low Ward", "{direction} Rows", "{feature} Alley", "{feature} Bottoms"]

  - id: outskirts
    placement: edge
    name: Outskirts
    weight: 2
    statuses: [poor, modest]
    names: ["The Edge", "{direction} Fields", "{direction} Yards", "Outer {feature}", "{feature} End"]

  - id: harbour
    placement: waterside
    name: Harbour
    when: port
    statuses: [poor, modest]
    names: ["Harbourside", "The Quays", "{direction} Wharf"]

  - id: shanty
    placement: edge
    name: Shanty town
    when: shantyTown
    statuses: [poor]
    names: ["Mudtown", "The Shambles", "{direction} Camp", "Tin Row"]
