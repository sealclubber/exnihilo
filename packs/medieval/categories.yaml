- {id: construction, name: Construction, share: 10}  # building and repair
- {id: military, name: Military, share: 5}           # garrison and civic order
- {id: luxury, name: Luxury, share: 5}               # goods and services beyond need
- {id: trade, name: Trade, share: 35}                # goods made for sale elsewhere, and the people who move them
