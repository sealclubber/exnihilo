# The numbers behind a town's layout: streets, blocks, lots and water.
# All lengths are in metres. Every value is a placeholder to be tuned by eye:
# edit, then run the layout again or restart the server.
#
# Two generators read this file. The `grid` is deliberately regular: a street
# grid trimmed to a compact outline, with lots along the streets. The `grown`
# one scatters blocks and lets the streets be the gaps between them; water,
# walls and the plaza are its alone.

# Which generator lays towns out: `grid`, or `grown`, whose own numbers are
# in the `grown` block at the end of this file. The numbers before that block
# are read by both. Left out, the grid.
generator: grown

# The full width of the roadway, per kind of street segment. Arterials are the
# streets that carry the brief's routes from the centre to the town's exits;
# streets run along the blocks and lanes across them.
streetWidths:
  arterial: 10
  street: 6
  lane: 4
  bridge: 8

# A block is the land between streets. Lots line its two long sides, so a
# lot's depth can be at most half the block's depth, or the whole depth for a
# lot that runs from street to street.
block:
  length: 80
  depth: 44

# The lot of any building type not listed under `lots`.
defaultLot: {frontage: 8, depth: 20}

# Lot sizes by building type: `frontage` along the street, `depth` back from
# it. A dwelling that holds several households has a larger lot than one that
# holds a single household.
lots:
  # Dwellings
  shack: {frontage: 6, depth: 12}
  cottage: {frontage: 8, depth: 18}
  row-house: {frontage: 10, depth: 20}
  tenement: {frontage: 16, depth: 22}
  townhouse: {frontage: 9, depth: 22}
  mansion: {frontage: 20, depth: 44}
  noble-house: {frontage: 30, depth: 44}
  # Workplaces that need room
  market-stall: {frontage: 4, depth: 6}
  farmstead: {frontage: 24, depth: 22}
  dairy: {frontage: 14, depth: 22}
  mill: {frontage: 14, depth: 22}
  brewery: {frontage: 14, depth: 22}
  town-yard: {frontage: 20, depth: 22}
  woodyard: {frontage: 20, depth: 22}
  carters-yard: {frontage: 22, depth: 22}
  stockyard: {frontage: 24, depth: 22}
  chapel: {frontage: 12, depth: 22}
  masons-yard: {frontage: 20, depth: 22}
  builders-yard: {frontage: 20, depth: 22}
  kiln-yard: {frontage: 20, depth: 22}
  watch-house: {frontage: 10, depth: 20}
  barracks: {frontage: 30, depth: 44}
  players-hall: {frontage: 14, depth: 22}
  warehouse: {frontage: 16, depth: 22}
  tannery: {frontage: 18, depth: 22}
  weaving-shed: {frontage: 14, depth: 22}
  dye-works: {frontage: 14, depth: 22}
  glassworks: {frontage: 14, depth: 22}
  foundry: {frontage: 16, depth: 22}
  rigging-loft: {frontage: 24, depth: 22}
  garment-workshop: {frontage: 12, depth: 22}
  press-house: {frontage: 14, depth: 22}
  boatyard: {frontage: 30, depth: 44}
  paper-mill: {frontage: 16, depth: 22}
  powder-mill: {frontage: 16, depth: 22}
  distillery: {frontage: 14, depth: 22}
  mint: {frontage: 14, depth: 22}
  mine: {frontage: 30, depth: 44}
  preserving-house: {frontage: 14, depth: 22}
  # Landmarks
  citadel: {frontage: 80, depth: 44}
  palace: {frontage: 80, depth: 44}
  temple: {frontage: 40, depth: 44}
  market-square: {frontage: 50, depth: 44}
  docks: {frontage: 40, depth: 44}
  province-hall: {frontage: 24, depth: 44}
  gatehouse: {frontage: 12, depth: 12}
  # Civic buildings
  well: {frontage: 6, depth: 6}
  public-oven: {frontage: 10, depth: 16}
  bathhouse: {frontage: 16, depth: 22}
  granary: {frontage: 16, depth: 22}
  infirmary: {frontage: 18, depth: 22}
  town-hall: {frontage: 24, depth: 22}
  guild-hall: {frontage: 16, depth: 22}
  adventurers-guild: {frontage: 14, depth: 22}
  # Lodging and the visitors' quarter
  inn: {frontage: 16, depth: 22}
  gaming-house: {frontage: 12, depth: 22}

# Footprints: the outline of the building on each lot. The generator draws one
# rectangle across the lot's street frontage; `coverage` is how far back it
# reaches, as a share of the lot's depth, and the rest of the lot is open
# ground: a yard. 0 means no building at all, 1 a building that fills the lot.
#
#   coverage  for any building type not listed under `types`
#   types     building types that differ
#
# A type marked openAir in workplaces.yaml or landmarks.yaml has no footprint
# unless it is listed here: a yard is open ground, with perhaps a shed or a
# stable at the street. All values are placeholders.
footprints:
  coverage: 0.6
  types:
    # Dwellings: the poor build over more of less land.
    shack: 0.7
    tenement: 0.8
    mansion: 0.45
    noble-house: 0.45
    # Open-air places with something built on them.
    stockyard: 0.25
    carters-yard: 0.2
    boatyard: 0.2
    masons-yard: 0.15
    builders-yard: 0.15
    kiln-yard: 0.3
    # Big sites with open ground inside them.
    farmstead: 0.35
    barracks: 0.5
    citadel: 0.5
    palace: 0.5
    temple: 0.7
    gatehouse: 1
    granary: 0.8
    town-hall: 0.8
    guild-hall: 0.8

# The brief says where a river arrives and leaves but not how wide it is.
riverWidth: 14

# A sanity check on the result: residents per hectare of built area, which is
# the total area of the lots. A layout outside these limits is rejected.
density:
  min: 60
  max: 700

# A waterside district (see `placement` in districts.yaml) must come within
# this distance of the sea or the river.
watersideReach: 40

# Building types placed on the side of their district that faces a route exit.
# Town walls have no geometry yet; gatehouses are ordinary lots.
atExits: [gatehouse]

# --- The grown generator (phases 6D to 6D.2) -------------------------------
# Road first. The brief's routes are laid as highways before anything else;
# arterials branch off them; ground is taken nearest the roads first, so the
# town stretches along its road; blocks are seeded as brickwork in the grain of
# the nearest road, and the streets are the gaps between them. EVERY NUMBER IS
# A PLACEHOLDER, to be tuned by eye against the renders in docs/renders. The
# starting values are the prototype's in docs/prototypes/proto_road.py.
grown:
  # How far a highway strays from a straight line; exits within `through`
  # degrees of opposite make one road through the centre; how far a highway
  # runs on past the town before its exit.
  highways: {wander: 55, through: 50, beyond: 200}
  # Arterials branch off each highway, alternating sides, `spacing` metres
  # apart, along a stretch `span` times the square root of the town's ground
  # either side of the centre. Near the centre one is `reach` times that root
  # long, `fall` metres shorter for each metre further out, times a share drawn
  # from `spread`. `turn` (degrees) and `lean` set how far from a right angle
  # it leaves; `wander` how far it strays; `width` its roadway.
  arterials:
    width: 8
    spacing: {min: 120, max: 210}
    span: 0.5
    reach: 0.5
    fall: 0.75
    spread: {min: 0.75, max: 1.1}
    turn: 20
    lean: 0.3
    wander: 40
    shortest: 60
  # The order ground is built on: distance from the nearest highway, plus
  # `along` per metre along it from the centre, plus `arterial` per metre from
  # the nearest arterial (up to `arterialCap`), plus slow noise. Ground across
  # the water from its nearest road costs `water` more; a block on a highway
  # costs `frontage` less, so the road's frontage is built on first.
  ground: {along: 0.45, arterial: 0.8, arterialCap: 200, noise: {depth: 30, length: 150}, water: 400, frontage: 120}
  # Patches share a grain taken from their nearest road, turned by up to about
  # `turn` degrees.
  patches: {spacing: 200, turn: 10}
  # Blocks are seeded as brickwork: rows `depth` apart, seeds `length` apart
  # along a row, both varied per patch; every other row moved half a length.
  # The oldest blocks are `oldScale` times the size of the newest.
  blocks:
    depth: 46
    length: 105
    depthSpread: {min: 0.85, max: 1.3}
    lengthSpread: {min: 0.75, max: 1.35}
    rowShift: 0.15
    jitter: {along: 0.16, across: 0.1}
    oldScale: 0.8
  # No block seed within `clear` of a road or `waterClear` of water; pairs
  # `offset` either side of each road, `spacing` apart, so roads fall between
  # blocks. Seeds nearer than `nearest` to an earlier one are dropped.
  roadSeeds: {clear: 20, waterClear: 22, offset: 23, spacing: {min: 50, max: 90}, nearest: 14}
  # Two streets at a junction within `through` degrees of straight are one
  # street passing through; junctions are pulled `pull` of the way toward the
  # line of that street over `rounds` rounds. Streets shorter than `shortest`
  # are closed up; one passing fewer than `laneBelow` junctions is a lane. A
  # block's corners are cut back `corner` metres.
  streets: {through: 40, rounds: 10, pull: 0.45, shortest: 7, laneBelow: 2, corner: 1.5}
  # Clear ground between a roadway and the lots along it.
  roadside: 0.4
  # The share of the town's ground, streets included, that lots cover.
  lotShare: 0.6
  # How far beyond the last junction of its highway an exit stands.
  exitReach: 70
  # A block joins the nearest district, crossing a highway, an arterial or the
  # water counting as so many metres more.
  districts:
    penalty: {highway: 300, arterial: 220, water: 600}
  # At most this many blocks inside the town are left as greens, with no lots.
  greens: 2
  # Wells and public ovens stand at least this far from another of their
  # type, where the district has the room.
  civicSpacing: 70
  # The plaza of a town flagged for one: square metres for each resident,
  # between a least and a most, and the building whose lot it is.
  plaza: {perResident: 0.09, min: 1200, max: 4500, building: market-square}
  # The wall of a town flagged for one: its width, the clear strip inside it,
  # the share of the town's ground it encloses (the oldest), the number of
  # residents below which it encloses everything, how many metres its line is
  # smoothed over, and the building at each gate.
  wall: {width: 3, clearStrip: 4, share: 0.75, enclosesAllBelow: 1000, smoothing: 60, gatehouse: gatehouse}
  # A river: meanders eleven widths long, swinging aside by a share of that;
  # width varying by a share along its length; the length of the pieces its
  # line is cut into; and the size above which a town on both banks has a
  # second bridge.
  river: {meanderLength: 11, meanderSwing: 0.14, widthVariation: 0.25, pieceLength: 2.5, secondBridgeAbove: 5000}
  # The coast: broad bays and headlands, a smaller wobble on top, and the bay
  # a port's harbour stands in. Lengths are along the shore, depths across it.
  coast:
    bays: {length: 700, depth: 60}
    wobble: {length: 110, depth: 9}
    harbour: {length: 320, depth: 70}
    pieceLength: 8
  # Lots. A block is cut along its length into two rows back to back, or one
  # where it is shallower than `rows`; the line between `split` of the way
  # across. Rows are cut into strips across, sides askew by about `skew`
  # metres. A strip's frontage is the type's within `frontageSpread`, then set
  # so its area is within `area` of the pack's size, between `leastFrontage`
  # and `widest` times the type's. A lot of `wholeBlock` square metres or more
  # takes a block. Blocks of growth rank below `oldBelow`, and in the `filled`
  # district kinds, are built wall to wall; elsewhere a gap follows a lot with
  # the chance given for the kind.
  lots:
    rows: 30
    split: {min: 0.44, max: 0.56}
    skew: 0.9
    frontageSpread: 0.3
    leastFrontage: 4
    widest: 3.5
    area: {min: 0.7, max: 1.35}
    wholeBlock: 1300
    oldBelow: 0.45
    filled: [centre, craft, visitors, harbour]
    gaps: {common: 0.08, upper: 0.2, lower: 0.1, outskirts: 0.3, shanty: 0.05}
    gapWidth: {min: 2, max: 9}
