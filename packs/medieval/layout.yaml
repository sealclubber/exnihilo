# The numbers behind a town's layout: streets, blocks, lots and water.
# All lengths are in metres. Every value is a placeholder to be tuned by eye:
# edit, then run the layout again or restart the server.
#
# Two generators read this file. The `grid` is deliberately regular: a street
# grid trimmed to a compact outline, with lots along the streets. The `grown`
# one lays roads first, cuts the ground between them into wards and the wards
# into buildings; water, walls and the plaza are its alone.

# Which generator lays towns out: `grid`, or `grown`, whose own numbers are
# in the `grown` block at the end of this file. The numbers before that block
# are read by both. Left out, the grid.
generator: grown

# The full width of the roadway, per kind of street segment. Arterials are the
# streets that carry the brief's routes from the centre to the town's exits;
# streets run along the blocks and lanes across them.
streetWidths:
  arterial: 10
  street: 6
  lane: 4
  bridge: 8

# A block is the land between streets. Lots line its two long sides, so a
# lot's depth can be at most half the block's depth, or the whole depth for a
# lot that runs from street to street.
block:
  length: 80
  depth: 44

# The lot of any building type not listed under `lots`.
defaultLot: {frontage: 8, depth: 20}

# Lot sizes by building type: `frontage` along the street, `depth` back from
# it. A dwelling that holds several households has a larger lot than one that
# holds a single household.
lots:
  # Dwellings
  shack: {frontage: 6, depth: 12}
  cottage: {frontage: 8, depth: 18}
  row-house: {frontage: 10, depth: 20}
  tenement: {frontage: 16, depth: 22}
  townhouse: {frontage: 9, depth: 22}
  mansion: {frontage: 20, depth: 44}
  noble-house: {frontage: 30, depth: 44}
  # Workplaces that need room
  market-stall: {frontage: 4, depth: 6}
  farmstead: {frontage: 24, depth: 22}
  dairy: {frontage: 14, depth: 22}
  mill: {frontage: 14, depth: 22}
  brewery: {frontage: 14, depth: 22}
  town-yard: {frontage: 20, depth: 22}
  woodyard: {frontage: 20, depth: 22}
  carters-yard: {frontage: 22, depth: 22}
  stockyard: {frontage: 24, depth: 22}
  chapel: {frontage: 12, depth: 22}
  masons-yard: {frontage: 20, depth: 22}
  builders-yard: {frontage: 20, depth: 22}
  kiln-yard: {frontage: 20, depth: 22}
  watch-house: {frontage: 10, depth: 20}
  barracks: {frontage: 30, depth: 44}
  players-hall: {frontage: 14, depth: 22}
  warehouse: {frontage: 16, depth: 22}
  tannery: {frontage: 18, depth: 22}
  weaving-shed: {frontage: 14, depth: 22}
  dye-works: {frontage: 14, depth: 22}
  glassworks: {frontage: 14, depth: 22}
  foundry: {frontage: 16, depth: 22}
  rigging-loft: {frontage: 24, depth: 22}
  garment-workshop: {frontage: 12, depth: 22}
  press-house: {frontage: 14, depth: 22}
  boatyard: {frontage: 30, depth: 44}
  paper-mill: {frontage: 16, depth: 22}
  powder-mill: {frontage: 16, depth: 22}
  distillery: {frontage: 14, depth: 22}
  mint: {frontage: 14, depth: 22}
  mine: {frontage: 30, depth: 44}
  preserving-house: {frontage: 14, depth: 22}
  # Landmarks
  citadel: {frontage: 80, depth: 44}
  palace: {frontage: 80, depth: 44}
  temple: {frontage: 40, depth: 44}
  market-square: {frontage: 50, depth: 44}
  docks: {frontage: 40, depth: 44}
  province-hall: {frontage: 24, depth: 44}
  gatehouse: {frontage: 12, depth: 12}
  # Civic buildings
  well: {frontage: 6, depth: 6}
  public-oven: {frontage: 10, depth: 16}
  bathhouse: {frontage: 16, depth: 22}
  granary: {frontage: 16, depth: 22}
  infirmary: {frontage: 18, depth: 22}
  town-hall: {frontage: 24, depth: 22}
  guild-hall: {frontage: 16, depth: 22}
  adventurers-guild: {frontage: 14, depth: 22}
  # Lodging and the visitors' quarter
  inn: {frontage: 16, depth: 22}
  gaming-house: {frontage: 12, depth: 22}

# Footprints: the outline of the building on each lot. The generator draws one
# rectangle across the lot's street frontage; `coverage` is how far back it
# reaches, as a share of the lot's depth, and the rest of the lot is open
# ground: a yard. 0 means no building at all, 1 a building that fills the lot.
#
#   coverage  for any building type not listed under `types`
#   types     building types that differ
#
# A type marked openAir in workplaces.yaml or landmarks.yaml has no footprint
# unless it is listed here: a yard is open ground, with perhaps a shed or a
# stable at the street. All values are placeholders.
footprints:
  coverage: 0.6
  types:
    # Dwellings: the poor build over more of less land.
    shack: 0.7
    tenement: 0.8
    mansion: 0.45
    noble-house: 0.45
    # Open-air places with something built on them.
    stockyard: 0.25
    carters-yard: 0.2
    boatyard: 0.2
    masons-yard: 0.15
    builders-yard: 0.15
    kiln-yard: 0.3
    # Big sites with open ground inside them.
    farmstead: 0.35
    barracks: 0.5
    citadel: 0.5
    palace: 0.5
    temple: 0.7
    gatehouse: 1
    granary: 0.8
    town-hall: 0.8
    guild-hall: 0.8

# The brief says where a river arrives and leaves but not how wide it is.
riverWidth: 14

# A sanity check on the result: residents per hectare of built area, which is
# the total area of the lots. A layout outside these limits is rejected.
density:
  min: 60
  max: 700

# A waterside district (see `placement` in districts.yaml) must come within
# this distance of the sea or the river.
watersideReach: 40

# Building types placed on the side of their district that faces a route exit.
# Town walls have no geometry yet; gatehouses are ordinary lots.
atExits: [gatehouse]

# --- The grown generator (phase 6D.3) -------------------------------------
# Roads, then wards, then buildings. The brief's routes are laid as highways
# before anything else and arterials branch off them; the town takes the
# ground nearest its roads first, as much as its buildings need; the roads cut
# that ground into wards; and each ward is cut in two again and again until
# the pieces are its buildings. EVERY NUMBER IS A PLACEHOLDER, to be tuned by
# eye against the renders in docs/renders. The starting values are the
# prototype's, docs/prototypes/proto_combined.py.
grown:
  # Roadway widths. A highway carries a route; an arterial branches off one,
  # as does the road to a bridge; a street runs along a river bank or splits a
  # ward; an alley is the gap a cut leaves between buildings, with a lane
  # down it.
  widths: {highway: 10, arterial: 7, street: 4.5, alley: 2.4, bridge: 10}
  # How far a highway strays from a straight line, and no more than
  # `wanderShare` of the town's radius; exits within `through`
  # degrees of opposite make one road through the centre; how far a highway
  # runs on past the town before its exit; how far either side of a river it
  # leaves its line to meet a bridge square to the bank.
  highways: {wander: 55, wanderShare: 0.15, through: 50, beyond: 200, approach: 85}
  # Arterials branch off each highway, alternating sides, `spacing` metres
  # apart, along a stretch `span` times the town's radius either side of the
  # centre. One is `reach` times the radius long, less `fall` for each metre
  # along the highway from the centre, times a share drawn from `spread`. It
  # leaves square, leaning along the highway by about `lean`, and strays by
  # `wander` metres; it stops `bank` metres from water. Once the ground is
  # known it is cut back to `trim` metres past it, and dropped if shorter than
  # `shortest`.
  arterials:
    spacing: {min: 130, max: 220}
    span: 1.25
    reach: 1.5
    fall: 0.7
    spread: {min: 0.75, max: 1.1}
    lean: 0.3
    wander: 35
    bank: 11
    trim: 5
    shortest: 25
  # Bridges stand square to the bank, ending `landing` metres beyond the
  # water. A town of more than `secondAbove` residents has a second bridge
  # `apart` metres along the river from the first, with an arterial of its
  # own that strays `wander` metres and runs `beyond` times the town's radius
  # past the far end.
  bridges: {landing: 7, secondAbove: 5000, apart: 260, wander: 20, beyond: 0.75}
  # A street follows each bank of a river, this far out from the water.
  quays: {offset: 8}
  # The ground the town needs is its buildings' lot area over `fill`, times
  # `margin`. It is taken cheapest first on a grid of `cell` metres. Cost is
  # the distance from the nearest highway, plus `along` per metre along it
  # from the centre, plus `arterial` per metre from the nearest arterial (up
  # to `arterialCap`), plus smooth noise; ground across the water from its
  # highway costs `water` more, and none within `wet` metres of the water is
  # taken. The outline closes gaps of `close` metres and opens necks of
  # `open`; nothing is built within `waterClear` metres of the water.
  ground:
    fill: 0.8
    margin: 1.12
    cell: 12
    along: 0.45
    arterial: 0.8
    arterialCap: 200
    noise: {depth: 70, length: 72}
    water: 400
    wet: 4
    close: 28
    open: 10
    waterClear: 6
  # A ward larger than a limit drawn from `limit` square metres is split by a
  # street across its long axis, `at` of the way along, turned by about
  # `turn` degrees and bent aside by `bend` of its width, at most `rounds`
  # times over. A piece under `least` square metres is no ward.
  wards: {limit: {min: 6500, max: 15000}, at: {min: 0.36, max: 0.64}, turn: 11.5, bend: 0.07, rounds: 8, least: 250}
  # Buildings. Each ward is cut in two again and again across its long axis.
  # A cut leaves an alley while the piece is over its building size times
  # `alleyAbove` divided by a small draw; cuts are square once a piece is
  # under `squareBelow` building sizes; finished pieces come out at about
  # `pieceShare` of the building size. Each kind of district has a character:
  # how far cuts wander from square and the middle (`gridChaos`, drawn per
  # ward), how much sizes vary (`sizeChaos`), and the chance a piece is left
  # open. Building size varies from ward to ward by `vary`. Buildings over
  # `big` times the building size are cut for first, a half within `bigMatch`
  # of one's size going to it. The last `loose.share` of wards by growth are
  # loose: more pieces left open toward the edge, and buildings drawn in from
  # their lots by `loose.pull` metres. A ward with little road along it is
  # given no more buildings than `frontDepth` metres of ground behind that
  # road would hold.
  buildings:
    frontDepth: 60
    alleyAbove: 1
    squareBelow: 4
    pieceShare: 0.7
    character:
      default: {gridChaos: {min: 0.5, max: 0.8}, sizeChaos: 0.7, open: 0.02}
      centre: {gridChaos: {min: 0.6, max: 0.9}, sizeChaos: 0.6, open: 0.02}
      upper: {gridChaos: {min: 0.3, max: 0.5}, sizeChaos: 0.7, open: 0.06}
      outskirts: {gridChaos: {min: 0.5, max: 0.8}, sizeChaos: 0.7, open: 0.05}
      shanty: {gridChaos: {min: 0.7, max: 1}, sizeChaos: 0.8, open: 0.01}
    vary: {min: 0.75, max: 1.3}
    big: 3
    bigMatch: 0.3
    loose: {share: 0.2, open: {min: 0.22, max: 0.47}, pull: {min: 0.6, max: 2.2}}
  # A ward joins the district whose seed ward is nearest, crossing a highway,
  # an arterial or the water counting as so many metres more; over `rounds`
  # rounds each district's reach is set so its ground matches its buildings.
  districts:
    penalty: {highway: 150, arterial: 110, water: 400}
    rounds: 12
  # The plaza of a town flagged for one: square metres for each resident,
  # between a least and a most, and the building whose lot it is.
  plaza: {perResident: 0.09, min: 1200, max: 4500, building: market-square}
  # The wall of a town flagged for one: its width, the share of the town's
  # ground it encloses (the oldest), the number of residents below which it
  # encloses everything, how many metres its line is smoothed over, and the
  # building at each gate.
  wall: {width: 3, share: 0.75, enclosesAllBelow: 1000, smoothing: 60, gatehouse: gatehouse}
  # A river: meanders eleven widths long, swinging aside by a share of that;
  # width varying by a share along its length; the length of the pieces its
  # line is cut into; how far from the centre it passes at the least, beyond
  # the plaza. A coast stands as far beyond the town's oldest ground.
  river: {meanderLength: 11, meanderSwing: 0.14, widthVariation: 0.25, pieceLength: 2.5, beside: 60}
  # The coast: broad bays and headlands, a smaller wobble on top, and the bay
  # a port's harbour stands in. Lengths are along the shore, depths across it.
  coast:
    bays: {length: 700, depth: 60}
    wobble: {length: 110, depth: 9}
    harbour: {length: 320, depth: 70}
    pieceLength: 8
