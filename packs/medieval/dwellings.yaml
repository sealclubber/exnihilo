- {id: townhouse, name: Townhouse, status: comfortable, households: 1, weight: 1}
- {id: mansion, name: Mansion, status: wealthy, households: 1, weight: 1}
- {id: noble-house, name: Noble house, status: noble, households: 1, weight: 1}
