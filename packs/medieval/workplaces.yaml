# Every building type that people work in, apart from landmarks.
#
# Work done in someone else's home, such as a servant's, has no building type
# here: see `employer` in occupations.yaml.
#
#   capacity           workers one building holds; more buildings are made as needed
#   proprietorLivesIn  true: the first household head placed in the building lives
#                      there with their household, and it counts as their home.
#                      An apprentice is never the proprietor.
#
# A head and the members of their household who share the head's occupation
# work in the same building, as far as its capacity allows.
#   district           the kind of district (districts.yaml) the building prefers
#   openAir            optional. true: the work is done out of doors, so everyone
#                      staying here, worker or visitor, is outside on the lot and
#                      can be seen on the town map. Which types are open-air is a
#                      first guess: stalls and yards.
#   alwaysOpen         optional. true: a public place that can be visited at any
#                      hour with nobody in attendance. Without it a building is
#                      open only while someone who works there is on shift.

