# Buildings that a flag or status adds, civic buildings that a settlement has
# by its size, and the fixed posts they create.
#
#   when      optional: capital, port, citadel, walls, plaza, temple, shantyTown
#             or provinceSeat. Left out, the building depends only on size.
#   minPopulation  optional: a settlement with fewer residents has none
#   district  the kind of district the building prefers
#   spread    optional. true: instead of preferring a district, the buildings
#             are shared out among the districts in proportion to their
#             residents, so every part of town has one and no district has all
#   count     how many buildings: {fixed: n}, {perThousand: x, min: a, max: b}
#             or {perResidents: n, min: a, max: b}: one for every n residents.
#             Both grow with the settlement's population.
#             {perTravellers: n, min: a, max: b} is one for every n travellers
#             expected to arrive in a day by the rules in travellers.yaml; a
#             settlement that expects none has none, whatever `min` says.
#   posts     may be empty, for a building nobody staffs
#   posts     jobs that exist because the landmark does. Each takes a slot from
#             its occupation's category, and is shared out among the buildings.
#             The occupation must name this landmark as its workplace.
#   proprietorLivesIn  optional. true: the household of whoever holds the
#             first post listed lives in the building, as a proprietor's does
#             in a workplace. Each building gets one holder of each post in
#             turn before any gets a second.
#   openAir, alwaysOpen  optional, as in workplaces.yaml. The market square is
#             both: a public place out of doors. The docks are open-air.

- id: citadel
  name: Citadel
  when: citadel
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: castellan, count: {fixed: 1}}
    - {occupation: garrison-officer, count: {perThousand: 0.5, min: 1}}
    - {occupation: garrison-soldier, count: {perThousand: 8, min: 6}}

- id: gatehouse
  name: Gatehouse
  when: walls
  district: outskirts
  count: {perThousand: 0.25, min: 2, max: 8}
  posts:
    - {occupation: gate-guard, count: {perThousand: 1.5, min: 4}}

- id: temple
  name: Temple
  when: temple
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: high-priest, count: {fixed: 1}}
    - {occupation: temple-priest, count: {perThousand: 0.6, min: 2}}
    - {occupation: acolyte, count: {perThousand: 0.8, min: 2}}

- id: docks
  name: Docks
  when: port
  district: harbour
  openAir: true
  count: {perThousand: 0.3, min: 1, max: 6}
  posts:
    - {occupation: harbourmaster, count: {fixed: 1}}
    - {occupation: dock-worker, count: {perThousand: 12, min: 6}}

- id: market-square
  name: Market square
  when: plaza
  district: centre
  openAir: true
  alwaysOpen: true
  count: {fixed: 1}
  posts:
    - {occupation: market-warden, count: {perThousand: 0.3, min: 1}}

- id: palace
  name: Palace
  when: capital
  district: upper
  count: {fixed: 1}
  posts:
    - {occupation: courtier, count: {perThousand: 0.4, min: 3}}
    - {occupation: palace-official, count: {perThousand: 0.6, min: 4}}
    - {occupation: palace-guard, count: {perThousand: 1, min: 6}}

- id: province-hall
  name: Provincial administration hall
  when: provinceSeat
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: provincial-official, count: {perThousand: 0.5, min: 2}}
    - {occupation: provincial-clerk, count: {perThousand: 0.5, min: 2}}

# --- Civic buildings, by size ---------------------------------------------
# What a settlement has because of how many people live in it. Every number
# here is a placeholder: how many residents share a well, and how big a town
# must be before it has a bathhouse, are first guesses for review.

# Where the water comes from. Nobody staffs a well and it is never shut.
- id: well
  name: Well
  spread: true
  openAir: true
  alwaysOpen: true
  count: {perResidents: 250, min: 1}
  posts: []

# Households without an oven of their own bake here.
- id: public-oven
  name: Public oven
  minPopulation: 300
  spread: true
  count: {perResidents: 1500, min: 1}
  posts:
    - {occupation: oven-keeper, count: {perResidents: 1500, min: 1}}

- id: bathhouse
  name: Bathhouse
  minPopulation: 1500
  district: common
  count: {perResidents: 4000, min: 1}
  posts:
    - {occupation: bath-keeper, count: {perResidents: 4000, min: 1}}
    - {occupation: bath-attendant, count: {perResidents: 1500, min: 2}}

- id: granary
  name: Granary
  minPopulation: 1000
  district: outskirts
  count: {fixed: 1}
  posts:
    - {occupation: granary-keeper, count: {perResidents: 5000, min: 1}}

- id: infirmary
  name: Infirmary
  minPopulation: 2500
  district: lower
  count: {fixed: 1}
  posts:
    - {occupation: infirmarer, count: {perResidents: 8000, min: 1}}
    - {occupation: nurse, count: {perResidents: 2500, min: 2}}

- id: town-hall
  name: Town hall
  minPopulation: 5000
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: town-clerk, count: {perResidents: 4000, min: 2}}
    - {occupation: alderman, count: {perResidents: 5000, min: 2, max: 12}}

# The hall of the town's trades. Which trade leads is not modelled yet: this
# is one hall for them all.
- id: guild-hall
  name: Guild hall
  minPopulation: 3000
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: guild-master, count: {fixed: 1}}
    - {occupation: guild-clerk, count: {perResidents: 5000, min: 1}}

# The adventurers themselves arrive in a later phase. For now the hall has its
# staff.
- id: adventurers-guild
  name: Adventurers' guild hall
  minPopulation: 2000
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: guild-registrar, count: {fixed: 1}}
    - {occupation: guild-steward, count: {perResidents: 6000, min: 1}}

# --- Lodging and the visitors' quarter (phase 6C) --------------------------
# PLACEHOLDERS, for review: the user will add their own types and names for
# the visitors' quarter. To add one, define the building type here or in
# workplaces.yaml, give it a lot in layout.yaml, and list it under the
# `visitors` kind's `types` in districts.yaml.

# Where travellers lodge. A settlement has one for every so many travellers
# its rules expect in a day, and at least one wherever any are expected. The
# innkeeper's household lives in it, and it never shuts: a guest comes and
# goes at any hour.
- id: inn
  name: Inn
  district: centre
  alwaysOpen: true
  proprietorLivesIn: true
  count: {perTravellers: 12, min: 1}
  posts:
    - {occupation: innkeeper, count: {perTravellers: 12, min: 1}}
    - {occupation: inn-servant, count: {perTravellers: 15}}
    - {occupation: chambermaid, count: {perTravellers: 10}}

- id: gaming-house
  name: Gaming house
  minPopulation: 5000
  district: centre
  count: {fixed: 1}
  posts:
    - {occupation: gaming-keeper, count: {fixed: 1}}
    - {occupation: table-keeper, count: {perResidents: 10000, min: 1}}
