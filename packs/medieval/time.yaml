# The world clock's speeds, in game seconds per real second.
#
#   1     real time: one game day takes 24 real hours
#   30    one game day takes 48 real minutes
#   3600  one game day takes 24 real seconds
#
# The viewer offers these as buttons. The clock starts at the default.
rates: [1, 10, 30, 120, 600, 3600]
defaultRate: 1
