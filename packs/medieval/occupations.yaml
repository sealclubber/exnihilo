# Every job.
#
#   id              lower-case, unique
#   name            shown in the inspector
#   category        food, utilities, services, construction, military, luxury or trade
#   workplace       a type from workplaces.yaml, or a landmark from landmarks.yaml
#   employer        instead of `workplace`, for work done in someone else's home:
#                   the status tiers whose households employ such workers, with a
#                   weight per tier, as in  employer: {tiers: {wealthy: 4, noble: 8}}
#                   The worker is attached to one such household and works where it
#                   lives. If the settlement has no household of a listed tier, the
#                   highest tier present employs them. An occupation has exactly one
#                   of `workplace` and `employer`.
#   weight          relative share of the category's slots. An occupation that works
#                   at a landmark is a fixed post: its weight is 0 and landmarks.yaml
#                   says how many there are.
#   status          a tier from pack.yaml
#   specialties     optional, trade only: the specialty tags this job belongs to
#   minPopulation   optional: the job does not exist in smaller settlements
#   minAge, maxAge  optional: ages outside this range cannot hold the job
#   sexes           optional: only the listed sexes can hold the job
#   shift           optional: the hours worked, naming a shift from shifts.yaml.
#                   Left out, the default shift applies. Apprentices keep the
#                   same hours. Or a list that splits the occupation across
#                   shifts: [{shift: a, share: 0.5}, {shift: b, share: 0.5}].
#                   The shares must add up to 1. In each settlement they are
#                   met exactly, and a worker keeps the same shift every day.
#   round           optional: a round from rounds.yaml. Part of each shift is
#                   then spent on foot, on circuits out from the workplace.
#   apprenticeUntil optional: a worker younger than this holds the job as an
#                   apprentice. 0 means the job has no apprenticeship. Left out, the
#                   pack-wide age in pack.yaml applies.
#
# The limits never change how many of each job a settlement has, only who gets
# them. If they cannot all be met, generation stops and names the occupation.
#
# PLACEHOLDERS, for review. The ages below are first guesses, not decisions:
#   - minAge is set on posts of authority, on learned professions and on the
#     military. Nothing else has an age limit, so children of working age
#     (species.yaml) hold every other job.
#   - apprenticeUntil is 0 on unskilled jobs; every other job uses the
#     pack-wide age.
#   - Inns and the gaming house (phase 6C): an innkeeper is 25 or older, an
#     inn servant or a chambermaid 14 or older; which jobs an inn has is a first
#     guess.
#   - Shifts: bakers and millers work early; tavern staff, innkeepers, the
#     gaming house, musicians and players work evenings; watchmen are split between the day, evening
#     and night watches; clergy keep their own hours.
#     The watch, the taverns and the clergy also work on rest days.
#   - No occupation sets `sexes`. The syntax, on an example that is not in use:
#       - {id: midwife, name: Midwife, category: services, workplace: healers-house, weight: 3, status: modest, sexes: [female]}

